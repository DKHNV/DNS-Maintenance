name: Reusable DNS maintenance

on:
  workflow_call:
    inputs:
      config_path:
        description: "Config path in the caller repository"
        required: false
        default: "dns-maintenance.json"
        type: string
      collection:
        description: "Collection name; empty means all collections"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Run checks without writing or committing"
        required: false
        default: false
        type: boolean
      engine_ref:
        description: "DNS-Maintenance ref used for engine checkout"
        required: false
        default: "main"
        type: string
    secrets:
      certspotter_api_key:
        required: false

# GITHUB_TOKEN permissions are deliberately controlled by the caller.
# Pilot callers use contents: read; production callers use contents: write.

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      ENGINE_ROOT: ${{ github.workspace }}/.dns-maintenance-engine

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout DNS-Maintenance engine
        uses: actions/checkout@v7
        with:
          repository: DKHNV/DNS-Maintenance
          ref: ${{ inputs.engine_ref }}
          path: .dns-maintenance-engine

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .dns-maintenance-engine/requirements.txt

      - name: Install engine dependencies
        run: python -m pip install -r .dns-maintenance-engine/requirements.txt

      - name: Verify engine import isolation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ENGINE_ROOT" python -P - <<'PY'
          from pathlib import Path
          import dns_maintenance

          loaded = Path(dns_maintenance.__file__).resolve()
          expected = (Path.cwd() / ".dns-maintenance-engine" / "dns_maintenance").resolve()
          print(f"Loaded engine package: {loaded}")
          if expected not in loaded.parents:
              raise SystemExit(f"Wrong dns_maintenance package loaded: {loaded}")
          PY

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$ENGINE_ROOT" python -P - <<'PY'
          from pathlib import Path
          from dns_maintenance.config import load_config

          load_config(Path("${{ inputs.config_path }}"))
          print("Configuration is valid")
          PY

      - name: Run DNS maintenance engine
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.certspotter_api_key }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo-root . --config "${{ inputs.config_path }}")
          if [[ -n "${{ inputs.collection }}" ]]; then
            args+=(--collection "${{ inputs.collection }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          PYTHONPATH="$ENGINE_ROOT" python -P -m dns_maintenance "${args[@]}"

      - name: Capture managed paths
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo-root . --config "${{ inputs.config_path }}" --managed-paths)
          if [[ -n "${{ inputs.collection }}" ]]; then
            args+=(--collection "${{ inputs.collection }}")
          fi
          PYTHONPATH="$ENGINE_ROOT" python -P -m dns_maintenance "${args[@]}" > "$RUNNER_TEMP/dns-managed-paths.bin"

      - name: Remove engine checkout from caller workspace
        if: ${{ !inputs.dry_run }}
        run: rm -rf .dns-maintenance-engine

      - name: Validate generated diff
        if: ${{ !inputs.dry_run }}
        run: git diff --check

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          xargs -0 -r git add -- < "$RUNNER_TEMP/dns-managed-paths.bin"
          if git diff --cached --quiet; then
            echo "No managed DNS changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dns): automatic maintenance $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
