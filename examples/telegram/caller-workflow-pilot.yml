name: DNS maintenance v1 pilot

on:
  workflow_dispatch:

# Read-only by design. The reusable workflow inherits these permissions and
# cannot elevate them.
permissions:
  contents: read

jobs:
  maintain:
    uses: DKHNV/DNS-Maintenance/.github/workflows/reusable-maintenance.yml@main
    with:
      config_path: dns-maintenance.json
      collection: telegram
      dry_run: true
      engine_ref: main
    secrets:
      certspotter_api_key: ${{ secrets.CERTSPOTTER_API_KEY }}
